name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # No registry-url: it writes empty _authToken and blocks OIDC.
      - uses: actions/setup-node@v4
        with:
          # staged publishing needs Node >= 22.14 and npm >= 11.15
          node-version: '22.14'

      - name: Upgrade npm for stage publish
        run: npm install -g npm@^11.15.0

      - run: bun install

      - name: Sync package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: bun run build

      # OIDC trusted publishing → stage queue; approve later with 2FA.
      - run: npm stage publish --access public
